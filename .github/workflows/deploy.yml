# .github/workflows/deploy.yml

name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main # Deploys when you push to the main branch
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: 22 # Default SSH port
          script_stop: true
          script: |
            #!/bin/bash
            
            # Source bashrc to load PATH (for npm, node, pm2)
            source ~/.bashrc || source ~/.bash_profile || true
            
            # Set PATH explicitly
            export PATH=$HOME/.nvm/versions/node/$(node -v 2>/dev/null | sed 's/v//')/bin:$PATH
            export PATH=$HOME/.npm-global/bin:/usr/local/bin:/usr/bin:/bin:$PATH
            
            # Navigate to your project directory
            cd /home/bhanuka/Grim-theatre-ticket-booking

            # Check git status before pull
            echo "📊 Checking git status..."
            git status

            # Stash any local changes
            echo "💾 Stashing local changes..."
            git stash || true

            # Reset any local changes (IMPORTANT!)
            echo "🔄 Resetting to latest main..."
            git fetch origin --depth=1
            git reset --hard origin/main

            # Verify we're on main branch
            echo "🌿 Current branch:"
            git branch --show-current

            # Show latest commit
            echo "📝 Latest commit:"
            git log -1 --oneline

            # Find npm and pm2 paths
            echo "🔍 Finding npm and pm2..."
            which npm || echo "npm not in PATH"
            which pm2 || echo "pm2 not in PATH"
            which node || echo "node not in PATH"

            # Verify script file exists
            echo "🔍 Checking for cleanup script..."
            ls -la backend/scripts/cleanup-abandoned-tickets.js || echo "⚠️ Script file not found!"

            # Create the backend .env file from the GitHub Secret
            echo "🤫 Creating backend .env file..."
            echo "${{ secrets.DOT_ENV }}" > backend/.env

            # Install backend dependencies
            echo "📦 Installing backend dependencies..."
            cd backend
            npm install

            # Install frontend dependencies and build for production
            echo "🎨 Building frontend..."
            cd ../frontend
            npm install
            npm run build

            # Restart the application with PM2
            echo "🚀 Restarting PM2 application..."
            cd ..
            pm2 restart ticket-api

            echo "✅ Deployment complete!"
