# .github/workflows/deploy.yml

name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main # Deploys when you push to the main branch
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: 22 # Default SSH port
          script: |
            # Navigate to your project directory
            cd /home/bhanuka/Grim-theatre-ticket-booking

            # Pull the latest code from the main branch
            echo "🚚 Pulling latest code..."
            git pull origin main

            # Create the backend .env file from the GitHub Secret
            echo "🤫 Creating backend .env file..."
            echo "${{ secrets.DOT_ENV }}" > backend/.env

            # Install backend dependencies
            echo "📦 Installing backend dependencies..."
            cd backend
            npm install

            # Install frontend dependencies and build for production
            echo "🎨 Building frontend..."
            cd ../frontend
            npm install
            npm run build

            # Restart the application with PM2
            echo "🚀 Restarting PM2 application..."
            cd ..
            pm2 restart ticket-api

            echo "✅ Deployment complete!"
