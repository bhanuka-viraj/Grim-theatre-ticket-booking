name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Production Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: 22
          script: |
            # Load NVM environment
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # Navigate to project
            cd ~/Grim-theatre-ticket-booking

            echo "🔍 Environment: Node $(node --version) | NPM $(npm --version) | PM2 $(pm2 --version)"

            # Pull latest code
            echo "� Pulling latest changes..."
            git stash
            git pull origin main
            echo "✓ Now at commit: $(git log -1 --oneline)"

            # Update backend .env
            echo "🔐 Updating backend environment..."
            echo "${{ secrets.DOT_ENV }}" > backend/.env

            # Install backend dependencies
            echo "📦 Installing backend dependencies..."
            cd backend
            npm install --quiet

            # Install and build frontend
            echo "🎨 Building frontend..."
            cd ../frontend
            npm install --quiet
            npm run build

            # Restart API server
            echo "🚀 Restarting API server..."
            cd ..
            pm2 restart ticket-api || pm2 start backend/src/index.js --name ticket-api

            echo "✅ Deployment successful!"
